summary = "Outlook - Image & Attachment Helper with OCR"
description = """Detects, lists, copies, and performs OCR and interactive AI chat/descriptions for images, screenshots, and file attachments (PDF, DOCX, images) in Microsoft Outlook Classic. Features 3 item categories (inline graphics, divider lines, attachments), magnified preview for low-vision users (P), context-sensitive help (F1), semantic heading and table navigation for AI answers, context action menu, prompt presets, hyperlink support, multi-turn chat, universal rich copy, and batch saving with descriptive filenames."""

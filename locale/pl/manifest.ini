summary = "Outlook - Pomocnik obrazów, załączników i OCR"
description = """Wykrywa, listuje, kopiuje oraz wykonuje OCR i interaktywne opisywanie/rozmowę przez AI o grafikach, zrzutach ekranu oraz załącznikach (pliki PDF, DOCX, obrazy itp.) w programie Microsoft Outlook Classic. Oferuje 3 kategorie elementów (grafiki, linie podziału, załączniki), powiększony podgląd dla słabowidzących (P), pomoc kontekstową (F1), semantyczną nawigację nagłówkami i tabelami po odpowiedziach AI, menu czynności, szablony promptów, obsługę hiperłączy, czat wieloturowy, uniwersalny eksport oraz seryjny zapis z czytelnymi nazwami plików."""
